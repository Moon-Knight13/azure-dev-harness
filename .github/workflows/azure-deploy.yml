name: Azure Validate & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/**'
      - 'azure.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/**'
      - 'azure.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging

permissions:
  id-token: write
  contents: read

env:
  AZURE_ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Validate main template
        run: az bicep build --file infra/main.bicep

      - name: Validate all modules
        run: |
          for f in infra/modules/*.bicep; do
            echo "Validating $f..."
            az bicep build --file "$f"
          done

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Deploy with azd
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt
          azd up --no-prompt
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
